<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Quest - A Dating Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #ec407a;
            margin: 10px 0;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            font-style: italic;
        }

        .sticky-bar {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sticky-bar-item {
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-group {
            margin: 15px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        .trait-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }

        .trait-btn {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .trait-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }

        .character-card {
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            position: relative;
        }

        .character-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .character-card.selected {
            border-color: #ec407a;
            background: #fce4ec;
        }

        .character-card.custom {
            border: 3px dashed #667eea;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }

        .char-emoji {
            font-size: 2.5em;
            margin: 8px 0;
        }

        .char-name {
            font-weight: 600;
            font-size: 1em;
            margin: 6px 0;
        }

        .char-desc {
            font-size: 0.75em;
            color: #666;
            margin-top: 4px;
        }

        .char-stats {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.7em;
            color: #10b981;
            font-weight: 600;
        }

        .bio-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .bio-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .location-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .location-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .location-card:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .location-card.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 8px;
            margin: 10px 0;
        }

        .time-btn {
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85em;
        }

        .time-btn.selected {
            background: #764ba2;
            color: white;
            border-color: #764ba2;
        }

        .actions-grid {
            display: grid;
            gap: 8px;
            margin: 15px 0;
        }

        .action-btn {
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: #f5f7ff;
            border-color: #667eea;
        }

        .action-btn.risk-low {
            border-left: 4px solid #10b981;
        }

        .action-btn.risk-medium {
            border-left: 4px solid #f59e0b;
        }

        .action-btn.risk-high {
            border-left: 4px solid #ef4444;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .custom-action {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .custom-action input {
            flex: 1;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .response-box {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            animation: fadeIn 0.5s;
        }

        .player-action {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            margin-bottom: 10px;
        }

        .char-response {
            background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
            color: white;
        }

        .relationship-stage {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-weight: 600;
            color: #78350f;
            font-size: 1.1em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pointPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes pointShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .point-positive {
            animation: pointPulse 0.5s ease-out;
        }

        .point-negative {
            animation: pointShake 0.4s ease-out;
        }

        .score-breakdown {
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 0.85em;
            animation: slideUp 0.3s ease-out;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            opacity: 0.9;
        }

        .breakdown-item .value-positive { color: #a7f3d0; font-weight: 600; }
        .breakdown-item .value-negative { color: #fca5a5; font-weight: 600; }

        .memory-hints {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }

        .memory-hint {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            color: #0369a1;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 500;
        }

        .location-preferred {
            position: relative;
        }

        .location-preferred::after {
            content: '💕';
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 0.7em;
        }

        .btn-primary {
            padding: 14px 32px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            padding: 12px 24px;
            font-size: 1em;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #f5f7ff;
        }

        .scene-desc {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-style: italic;
            color: #78350f;
        }

        .info-box {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            border: 2px solid #e0e0e0;
        }

        .stat-value {
            font-size: 1.4em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
        }

        .achievement {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            padding: 8px 12px;
            border-radius: 8px;
            margin: 6px 0;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .leaderboard {
            background: #f9fafb;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #e5e7eb;
            color: #666;
            font-size: 0.85em;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .about-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.3s;
        }

        .about-content {
            background: white;
            border-radius: 20px;
            padding: 35px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .about-content h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .about-content .version {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .about-content .creator {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin: 15px 0;
        }

        .about-content .copyright {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 25px;
        }

        .about-content .description {
            color: #555;
            line-height: 1.6;
            margin: 20px 0;
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .about-content .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 10px;
        }

        .about-content .stat-item {
            text-align: center;
        }

        .about-content .stat-number {
            font-size: 1.5em;
            font-weight: 700;
            color: #667eea;
        }

        .about-content .stat-label {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
        }

        .about-content .tech-note {
            color: #888;
            font-size: 0.85em;
            margin: 15px 0;
            font-style: italic;
        }

        .about-content .ai-credit {
            color: #999;
            font-size: 0.8em;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 2em; }
            .character-grid { grid-template-columns: repeat(2, 1fr); }
            .sticky-bar { font-size: 0.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="font-size: 3em; animation: pulse 2s infinite;">💕</div>
            <h1>Heart Quest</h1>
            <p class="subtitle">A Dating Game</p>
        </div>
        <div id="app"></div>
    </div>

    <script>
        const app = document.getElementById('app');
        
        const characters = [
            {
                name: 'Marcus', emoji: '💪', gender: 'male',
                personality: 'Athletic and competitive, lives for the gym',
                body: 'chalk on his palms, a vein at his temple',
                preferences: { locations: ['gym', 'park', 'beach'], times: ['morning', 'afternoon'],
                             attracted_to: ['female', 'male', 'nonbinary'], age: ['young', 'mid'] },
                interests: ['sports', 'fitness'],
                speech: {
                    great: ["Hell yeah. *racks the bar* That's the spirit.", "Dude. *pulls his earbud out for the first time* Yes."],
                    good: ["Solid. *nods, keeps the rhythm*", "I can work with that. *small smile*"],
                    poor: ["Eh. *checks his watch*", "You're throwing off my set, not gonna lie."],
                    bad: ["Nah. *puts the earbud back in*", "Don't talk to me while I'm under a bar."]
                },
                endings: {
                    success: "Marcus tosses you a clean towel. 'Same time tomorrow. Don't bail.'",
                    fail: "Marcus loads another plate. 'Hey — no hard feelings, yeah?' He's already not looking at you."
                }
            },
            {
                name: 'David', emoji: '📚', gender: 'male',
                personality: 'Intellectual introvert, deep thinker',
                body: 'a finger marking his page, glasses sliding down',
                preferences: { locations: ['library', 'cafe', 'bookstore', 'museum'], times: ['afternoon', 'evening', 'night'],
                             attracted_to: ['female', 'nonbinary'], age: ['mid', 'mature'] },
                interests: ['books', 'arts'],
                speech: {
                    great: ["Now that... is unexpectedly precise. *closes the book without losing his page*", "*pushes his glasses up* Say that again. Slower."],
                    good: ["I find that rather interesting. *marks his page*", "You're not entirely wrong. Go on."],
                    poor: ["I'm not entirely convinced. *opens his book again*", "That's... simplistic."],
                    bad: ["That's rather pedestrian. *puts in the second earbud*", "I expected better, frankly."]
                },
                endings: {
                    success: "David folds the corner of his page — a sin he never commits — and looks up. 'Coffee. Tomorrow. The same place. I'll bring the next book for you.'",
                    fail: "David nods, polite, distant. 'I should get back to this chapter.' He doesn't say which chapter."
                }
            },
            {
                name: 'Jake', emoji: '🎨', gender: 'male',
                personality: 'Creative artist, sensitive soul',
                body: 'ink on his knuckles, a pencil behind his ear',
                preferences: { locations: ['cafe', 'park', 'museum', 'beach'], times: ['noon', 'afternoon', 'evening'],
                             attracted_to: ['female', 'male', 'nonbinary'], age: ['young', 'mid'] },
                interests: ['arts', 'music'],
                speech: {
                    great: ["That speaks to my soul... *stops sketching*", "*draws a quick line on the back of his hand* Don't let me forget that."],
                    good: ["I can feel that energy. *looks up from his sketch*", "There's something here. Yeah."],
                    poor: ["Feels a bit... superficial? *goes back to drawing*", "Not quite resonating."],
                    bad: ["That's just... wrong. *literally turns the page*", "Please, just stop."]
                },
                endings: {
                    success: "Jake hands you the page he was sketching. It's you. He didn't ask permission. 'I have a thing on Friday — come.'",
                    fail: "Jake smiles the smile he gives strangers. 'Take care of yourself, yeah?' He's already drawing someone else."
                }
            },
            {
                name: 'Carlos', emoji: '🍳', gender: 'male',
                personality: 'Passionate chef, loves food and culture',
                body: 'a knife scar on his thumb, garlic on his fingers',
                preferences: { locations: ['cafe', 'bar', 'beach', 'park'], times: ['noon', 'afternoon', 'evening'],
                             attracted_to: ['female', 'male', 'nonbinary'], age: ['young', 'mid', 'mature'] },
                interests: ['food', 'travel'],
                speech: {
                    great: ["¡Perfecto! That's exactly the right heat.", "*kisses his fingers* Now we're cooking. You. I like you."],
                    good: ["Not bad. Not bad at all. *small nod*", "I like your style. Mm. There's something there."],
                    poor: ["Hmm. A bit bland for my taste. Needs salt.", "*rubs the back of his neck* Eh. Missing the spice."],
                    bad: ["Ay. No no no. *shakes his head and walks off*", "*makes a face* Not in my kitchen."]
                },
                endings: {
                    success: "Carlos writes a number on a napkin with the pencil from behind his ear. 'Saturday. I cook. You bring nothing. Bring yourself.'",
                    fail: "Carlos shrugs the cook's shrug — already thinking about prep. 'Buen provecho, friend. Next time.'"
                }
            },
            {
                name: 'Emma', emoji: '✨', gender: 'female',
                personality: 'Adventurous spirit, free-spirited',
                body: 'a friendship bracelet from somewhere she won\'t tell you about',
                preferences: { locations: ['beach', 'park', 'club', 'cafe'], times: ['afternoon', 'evening', 'night'],
                             attracted_to: ['male', 'female', 'nonbinary'], age: ['young', 'mid'] },
                interests: ['adventure', 'travel'],
                speech: {
                    great: ["OMG yes! *grabs your wrist*", "I'm in. Whatever it is, I'm in. *leans in*"],
                    good: ["I like where this is going! *bites her lip*", "Okay, you have my attention."],
                    poor: ["That's... kind of boring? *looks past your shoulder*", "Yikes, awkward."],
                    bad: ["Ew, no. *pulls her hand back*", "I'm gonna go find my friends."]
                },
                endings: {
                    success: "Emma pulls a piece of paper from her boot — actually her boot — and writes her number on it. 'I'm leaving for somewhere on Tuesday. Come.'",
                    fail: "Emma waves over her shoulder, already moving toward someone else. The wave is the goodbye."
                }
            },
            {
                name: 'Sophie', emoji: '🌸', gender: 'female',
                personality: 'Sweet and caring, values kindness',
                body: 'a paperback in her tote bag, a little flour on her sleeve',
                preferences: { locations: ['cafe', 'park', 'library', 'bookstore'], times: ['morning', 'noon', 'afternoon'],
                             attracted_to: ['male', 'female'], age: ['young', 'mid', 'mature'] },
                interests: ['books', 'nature'],
                speech: {
                    great: ["Oh my goodness! *covers her mouth and laughs*", "*touches your arm and immediately apologizes* That's so sweet."],
                    good: ["That's really nice. *small smile* Thank you.", "You're kind. I appreciate that."],
                    poor: ["Oh... um, okay. *pulls her sleeves over her hands*", "That's a bit much."],
                    bad: ["Please don't. *steps back*", "I think I should go. *starts looking for the exit*"]
                },
                endings: {
                    success: "Sophie writes her name in the margin of her book and tears the page out for you. 'I made too much bread this morning. Come over and help me eat it. Tomorrow?'",
                    fail: "Sophie says 'It was lovely meeting you' the way she'd say it to anyone. The bookstore swallows her."
                }
            },
            {
                name: 'Rachel', emoji: '💼', gender: 'female',
                personality: 'Ambitious professional, driven and focused',
                body: 'manicure tapping the rim of her cup, calendar open on her phone',
                preferences: { locations: ['cafe', 'work', 'bar', 'museum'], times: ['morning', 'evening', 'night'],
                             attracted_to: ['male', 'nonbinary'], age: ['mid', 'mature'] },
                interests: ['career', 'business'],
                speech: {
                    great: ["Impressive. *closes her laptop* Continue.", "Now you're speaking my language. You're not wasting my time."],
                    good: ["Solid approach. *small nod*", "I can work with this. Acceptable."],
                    poor: ["That's inefficient. *glances at her watch*", "Optimize and try again."],
                    bad: ["Waste of time. *opens her laptop*", "Next."]
                },
                endings: {
                    success: "Rachel slides her business card across the table. The cell number on the back is handwritten. 'Thursday. Seven. Don't be late. I'm not patient.'",
                    fail: "Rachel checks her watch. 'I have a six-thirty.' The six-thirty is escape."
                }
            },
            {
                name: 'Priya', emoji: '🧘‍♀️', gender: 'female',
                personality: 'Yoga instructor, mindful and balanced',
                body: 'a thin gold ring on her thumb, breath that goes all the way down',
                preferences: { locations: ['park', 'beach', 'cafe', 'gym'], times: ['morning', 'noon', 'afternoon'],
                             attracted_to: ['male', 'female', 'nonbinary'], age: ['young', 'mid', 'mature'] },
                interests: ['wellness', 'nature'],
                speech: {
                    great: ["That's beautiful energy. *bows slightly*", "Oh. *quiet smile* Hello, you."],
                    good: ["I feel good vibes from you. *nods slowly*", "Peaceful approach. I see you."],
                    poor: ["That disturbs my chakras. *takes a long breath*", "Not quite centered. Try again."],
                    bad: ["Very negative energy. *steps back*", "I need to protect my peace."]
                },

        function updateMemory(actionText, points) {

                mem.trustLevel += 1;

                mem.trustLevel = Math.max(0, mem.trustLevel - 2);
            } else if (points < 0) {
                mem.trustLevel = Math.max(0, mem.trustLevel - 1);
            }
            const humorWords = ['joke', 'funny', 'laugh', 'humor', 'pun', 'comedy'];
            const deepWords = ['discuss', 'philosophy', 'literature', 'meaning', 'think', 'intellectual', 'knowledge'];

            const rudeWords = ['stare', 'ignore', 'complain', 'argue', 'spill', 'kick', 'loud'];

            if (humorWords.some(w => lower.includes(w)) && points > 0) mem.likesHumor = true;
            if (deepWords.some(w => lower.includes(w)) && points > 0) mem.likesDeepTalk = true;
            if (physicalWords.some(w => lower.includes(w)) && points > 0) mem.likesPhysical = true;
            if (bragWords.some(w => lower.includes(w)) && points < 0) mem.hateBragging = true;
            if (rudeWords.some(w => lower.includes(w)) && points < 0) mem.hateRude = true;

            if (points > 5 && !mem.positiveTopics.includes(actionText)) {
                mem.positiveTopics.push(actionText);
                if (mem.positiveTopics.length > 5) mem.positiveTopics.shift();

            if (points < -3 && !mem.negativeTopics.includes(actionText)) {

                if (mem.negativeTopics.length > 5) mem.negativeTopics.shift();
            }

        function calculatePoints(action, repeated) {
            const char = characters.find(c => c.name === gameState.targetChar) || gameState.customChar;
            const breakdown = [];
            let points = action.base;
            breakdown.push({ label: 'Base', value: action.base });

            if (char.preferences.locations.includes(gameState.location)) {
                points += 5;
                breakdown.push({ label: '📍 Location match', value: 5 });
            }
            if (char.preferences.times.includes(gameState.timeOfDay)) {
                points += 5;
                breakdown.push({ label: '⏰ Time match', value: 5 });
            }
            if (gameState.playerTraits.age && char.preferences.age.includes(gameState.playerTraits.age)) {
                points += 8;
                breakdown.push({ label: '🎂 Age match', value: 8 });
            }
            if (char.preferences.attracted_to.includes(gameState.playerGender)) {
                points += 10;
                breakdown.push({ label: '💕 Attraction match', value: 10 });
            } else {
                points -= 5;
                breakdown.push({ label: '💔 No attraction', value: -5 });
            }
            if (gameState.playerTraits.interests.some(i => char.interests.includes(i))) {
                points += 6;
                breakdown.push({ label: '🎯 Shared interest', value: 6 });
            }
            if (gameState.playerTraits.personality === 'outgoing' && ['bar', 'club'].includes(gameState.location)) {
                points += 4;
                breakdown.push({ label: '😄 Personality fit', value: 4 });
            }
            if (gameState.playerTraits.personality === 'reserved' && ['library', 'cafe'].includes(gameState.location)) {
                points += 4;
                breakdown.push({ label: '😌 Personality fit', value: 4 });
            }
            if (gameState.playerTraits.style === 'professional' && gameState.location === 'work') {
                points += 5;
                breakdown.push({ label: '💼 Style bonus', value: 5 });
            }
            if (gameState.playerTraits.style === 'casual' && ['park', 'beach'].includes(gameState.location)) {
                points += 5;
                breakdown.push({ label: '👕 Style bonus', value: 5 });
            }
            // Character memory: trust bonus
            const memory = gameState.charMemory;
            if (memory.trustLevel > 3) {
                const trustBonus = Math.min(Math.floor(memory.trustLevel / 2), 5);
                points += trustBonus;
                breakdown.push({ label: '🤝 Trust bonus', value: trustBonus });
            }
            if (gameState.streak >= 3) {
                points += 3;
                breakdown.push({ label: '🔥 Streak bonus', value: 3 });
            }
            if (repeated) {
                const penalty = points - Math.floor(points * 0.4);
                points = Math.floor(points * 0.4);
                const repeatLabel = !gameState.repeatPenaltyTaught
                    ? '⚠️ They\'ve seen this before'
                    : '🔁 Repeat penalty';
                breakdown.push({ label: repeatLabel, value: -penalty });
                gameState.repeatPenaltyTaught = true;
            }

            return { total: points, breakdown };
        }

        function analyzeCustomAction(text) {
            const lower = text.toLowerCase();
            const char = characters.find(c => c.name === gameState.targetChar) || gameState.customChar;
            const stage = getRelationshipStage(gameState.points);
            const mem = gameState.charMemory;

            const compliments = ['beautiful', 'gorgeous', 'amazing', 'wonderful', 'stunning', 'incredible'];
            const help = ['help', 'assist', 'support', 'join', 'together'];
            const negative = ['stupid', 'ugly', 'boring', 'dumb', 'weird', 'creepy'];
            const romantic = ['love', 'kiss', 'date', 'marry', 'forever', 'heart', 'adore'];
            const humorWords = ['joke', 'funny', 'laugh', 'humor', 'pun'];
            const deepWords = ['discuss', 'philosophy', 'literature', 'meaning', 'think', 'books'];

            if (negative.some(w => lower.includes(w))) {
                return { points: -10, response: random(char.speech.bad), breakdown: [{ label: 'Negative words', value: -10 }] };
            }

            if (romantic.some(w => lower.includes(w))) {
                let successChance;
                if (stage.includes('Partner')) successChance = 0.95;
                else if (stage.includes('Love Interest')) successChance = 0.80;
                else if (stage.includes('Friend')) successChance = 0.55;
                else if (stage.includes('Acquaintance')) successChance = 0.25;
                else successChance = 0.10;
                if (mem.trustLevel >= 5) successChance = Math.min(successChance + 0.15, 0.95);
                const success = Math.random() < successChance;
                const breakdown = [{ label: 'Romantic action', value: success ? 20 : -8 }];
                if (!success && stage.includes('Stranger')) breakdown.push({ label: '⚠️ Too early!', value: 0 });
                return success ?
                    { points: 20, response: random(char.speech.great), breakdown } :
                    { points: -8, response: (stage.includes('Stranger') || stage.includes('Acquaintance')) ? `"Whoa, we just met... that's a bit forward." ${random(char.speech.poor)}` : random(char.speech.bad), breakdown };
            }

            if (compliments.some(w => lower.includes(w))) {
                const pts = mem.trustLevel >= 3 ? 14 : 10;
                return { points: pts, response: random(char.speech.good), breakdown: [{ label: 'Compliment', value: pts }] };
            }

            if (humorWords.some(w => lower.includes(w))) {
                const pts = mem.likesHumor ? 16 : 8;
                return { points: pts, response: mem.likesHumor ? `Ha! You know I love humor! ${random(char.speech.great)}` : random(char.speech.good), breakdown: [{ label: mem.likesHumor ? 'Humor (they love it!)' : 'Humor', value: pts }] };
            }

            if (deepWords.some(w => lower.includes(w))) {
                const pts = mem.likesDeepTalk ? 16 : 10;
                return { points: pts, response: mem.likesDeepTalk ? `I love these conversations with you! ${random(char.speech.great)}` : random(char.speech.good), breakdown: [{ label: mem.likesDeepTalk ? 'Deep talk (they love it!)' : 'Deep talk', value: pts }] };
            }

            if (help.some(w => lower.includes(w))) {
                return { points: 14, response: random(char.speech.good), breakdown: [{ label: 'Helpful action', value: 14 }] };
            }

            if (lower.includes('yourself') || lower.includes('be yourself')) {
                return { points: 10, response: random(char.speech.good), breakdown: [{ label: 'Authentic', value: 10 }] };
            }

            if (lower.includes(char.name.toLowerCase())) {
                return { points: 5, response: "You remembered my name! " + random(char.speech.good), breakdown: [{ label: 'Used their name', value: 5 }] };
            }

            // Fallback for unrecognized actions: neutral expected value (-5 to +8, mean ~+1.5).
            // Players should be rewarded for hitting recognized intents, not for typing nonsense.
            const randomPoints = Math.floor(Math.random() * 14) - 5;
            const responseLevel = randomPoints > 5 ? 'great' : randomPoints > 1 ? 'good' : randomPoints >= -1 ? 'poor' : 'bad';
            return { points: randomPoints, response: random(char.speech[responseLevel]), breakdown: [{ label: 'Improvised action', value: randomPoints }] };
        }

            return '';

        function getResponse(points, charName) {
            const char = characters.find(c => c.name === charName) || gameState.customChar;
            const mem = getMemoryLine();
            if (points >= 15) return mem + random(char.speech.great);
            if (points >= 8) return mem + random(char.speech.good);
            if (points >= 0) return random(char.speech.poor);
            return random(char.speech.bad);
        }

        function checkAchievements() {
            const a = gameState.achievements;
            const has = id => a.find(x => x.id === id);

            if (gameState.streak >= 5 && !has('streak5'))
                a.push({ id: 'streak5', name: '🔥 On Fire', desc: '5 positive actions in a row!' });
            if (gameState.streak >= 8 && !has('streak8'))
                a.push({ id: 'streak8', name: '🌟 Unstoppable', desc: '8 streak combo!' });
            if (gameState.points >= 100 && !has('century'))
                a.push({ id: 'century', name: '💯 Century', desc: 'Reached 100 points!' });
            if (gameState.points >= 150 && !has('srank'))
                a.push({ id: 'srank', name: '👑 S-Rank', desc: 'Scored 150+ points!' });
            if (gameState.encounterNum === 1 && gameState.points >= 20 && !has('firstImpression'))
                a.push({ id: 'firstImpression', name: '✨ First Impression', desc: '20+ points on first encounter!' });
            if (gameState.charMemory.trustLevel >= 8 && !has('trusted'))
                a.push({ id: 'trusted', name: '🤝 Trusted Friend', desc: 'Reached high trust level!' });
            if ((gameState.customActionCount || 0) >= 3 && !has('creative'))
                a.push({ id: 'creative', name: '🎨 Creative Soul', desc: 'Used 3+ custom actions!' });

            const locationsVisited = new Set();
            gameState.actionHistory.forEach(h => { if (h.location) locationsVisited.add(h.location); });
            if (gameState.location) locationsVisited.add(gameState.location);
            if (locationsVisited.size >= 4 && !has('explorer'))
                a.push({ id: 'explorer', name: '🗺️ Explorer', desc: 'Visited 4+ different locations!' });

            const allPositive = gameState.actionHistory.length >= 4 && gameState.actionHistory.every(h => h.points > 0);
            if (allPositive && gameState.actionHistory.length >= 4 && !has('charmer'))
                a.push({ id: 'charmer', name: '😍 Natural Charmer', desc: 'Every action was positive!' });
        }

                            <div style="margin: 12px 0 4px; animation: slideUp 0.5s ease-out;">
                                ${gameState.encounterNum >= gameState.maxEncounters
                                    ? '<button class="btn-primary" onclick="endGame()">✨ See Results</button>'
                                    : '<button class="btn-primary" onclick="nextEncounter()">→ Next Encounter</button>'}
                            </div>
                            <div style="text-align:center;color:#bbb;font-size:0.78em;margin-bottom:6px;">or take another action here</div>
                        ` : ''}

                        <h3 style="color: #667eea; margin: 16px 0 10px;">What do you do?</h3>

                        <div class="custom-action" style="margin-bottom: 14px;">
                            <input type="text" id="customAction" placeholder="✍️ Say anything..." onkeydown="if(event.key==='Enter')takeCustomAction()" />
                            <button class="btn-primary" style="width: auto; margin: 0;" onclick="takeCustomAction()">Go</button>
                        </div>

                        <div style="text-align:center;color:#bbb;font-size:0.78em;margin: 0 0 8px;">— or pick a preset —</div>

                        <div class="actions-grid">
                            ${actions[gameState.location].map((action, i) => `
                                <button class="action-btn risk-${action.risk}" onclick="takeAction(${i}, '${action.text.replace(/'/g, "\\'")}')">
                                    ${action.text}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            else if (gameState.screen === 'result') {
                const success = gameState.points >= gameState.requiredPoints;

                // Save progress only once per game
                if (!gameState.progressSaved) {
                    saveProgress();
                    gameState.progressSaved = true;
                }

                const grade = gameState.points >= 150 ? 'S' : gameState.points >= 120 ? 'A' : gameState.points >= 100 ? 'B' : gameState.points >= 70 ? 'C' : gameState.points >= 40 ? 'D' : 'F';
                const bestAction = gameState.actionHistory.length > 0 ? gameState.actionHistory.reduce((max, h) => h.points > max.points ? h : max, gameState.actionHistory[0]) : { actionText: 'None', points: 0 };
                const worstAction = gameState.actionHistory.length > 0 ? gameState.actionHistory.reduce((min, h) => h.points < min.points ? h : min, gameState.actionHistory[0]) : { actionText: 'None', points: 0 };

                const endChar = characters.find(c => c.name === gameState.targetChar) || gameState.customChar;
                const successText = (endChar && endChar.endings && endChar.endings.success)
                    ? endChar.endings.success
                    : `${gameState.targetChar} smiles warmly. "I've had an amazing time with you, ${gameState.playerName}. Want to make this official? Dinner this weekend?"`;
                const failText = (endChar && endChar.endings && endChar.endings.fail)
                    ? endChar.endings.fail
                    : `${gameState.targetChar} gives you a polite smile. "It was nice meeting you, but I don't think we're quite the right match. Take care."`;

                // Item 7 — Failure breath: show ending text alone for 2s before stats
                if (!success && !gameState.resultRevealed) {
                    if (!resultRevealTimeout) {
                        resultRevealTimeout = setTimeout(() => {
                            gameState.resultRevealed = true;
                            resultRevealTimeout = null;
                            render();
                        }, 2000);
                    }
                    app.innerHTML = `
                        <div style="text-align: center; padding: 40px 20px; animation: fadeIn 0.8s;">
                            <div style="font-size: 4em; margin: 20px 0;">💔</div>
                            <div class="scene-desc" style="margin: 20px 0; font-size: 1.05em;">${failText}</div>
                            <p style="color: #ccc; font-size: 0.8em; margin-top: 30px; animation: fadeIn 1.8s both;">· · ·</p>
                        </div>
                    `;
                    return;
                }

                app.innerHTML = `
                    <div style="text-align: center;">
                        <div style="font-size: 4em; margin: 20px 0;">
                            ${success ? '💕' : '💔'}
                        </div>
                        <h2 style="color: ${success ? '#10b981' : '#ef4444'}; margin: 20px 0;">
                            ${success ? 'Love Blossomed!' : 'Not Quite There...'}
                        </h2>

                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-value">${gameState.points}</div>
                                <div class="stat-label">Total Points</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${grade}</div>
                                <div class="stat-label">Grade</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${gameState.encounterNum}</div>
                                <div class="stat-label">Encounters</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${gameState.achievements.length}</div>
                                <div class="stat-label">Achievements</div>
                            </div>
                        </div>

                        <div class="scene-desc" style="margin: 20px 0;">${success ? successText : failText}</div>

                        ${gameState.achievements.length > 0 ? `
                            <div style="margin: 20px 0;">
                                <h3 style="color: #667eea; margin-bottom: 10px;">🏆 Achievements Unlocked</h3>
                                ${gameState.achievements.map(a => `
                                    <div class="achievement">${a.name}: ${a.desc}</div>
                                `).join('')}
                            </div>
                        ` : ''}

                        <div style="margin: 20px 0;">
                            <h3 style="color: #667eea; margin-bottom: 10px;">📊 Your Best & Worst</h3>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div class="stat-card" style="border-color: #10b981;">
                                    <div style="color: #10b981; font-size: 0.9em; margin-bottom: 8px;">💚 Best Move</div>
                                    <div style="font-size: 0.85em;">${bestAction.actionText}</div>
                                    <div style="color: #10b981; font-weight: 600; margin-top: 4px;">+${bestAction.points}</div>
                                </div>
                                <div class="stat-card" style="border-color: #ef4444;">
                                    <div style="color: #ef4444; font-size: 0.9em; margin-bottom: 8px;">😬 Worst Move</div>
                                    <div style="font-size: 0.85em;">${worstAction.actionText}</div>
                                    <div style="color: #ef4444; font-weight: 600; margin-top: 4px;">${worstAction.points}</div>
                                </div>
                            </div>
                        </div>

                        ${getMemoryHints().length > 0 ? `
                            <div style="margin: 20px 0;">
                                <h3 style="color: #667eea; margin-bottom: 10px;">🧠 What ${gameState.targetChar} Revealed</h3>
                                <div class="memory-hints" style="justify-content: center;">
                                    ${getMemoryHints().map(h => `<span class="memory-hint">${h}</span>`).join('')}
                                </div>
                                <div style="font-size: 0.85em; color: #666; margin-top: 8px;">Trust Level: ${'❤️'.repeat(Math.min(Math.floor(gameState.charMemory.trustLevel / 2), 5))}${'🤍'.repeat(5 - Math.min(Math.floor(gameState.charMemory.trustLevel / 2), 5))}</div>
                            </div>
                        ` : ''}

                        <div style="margin-top: 30px;">
                            <button class="btn-primary" onclick="quickReplay()">
                                🔄 Try Again with ${gameState.targetChar}
                            </button>
                            <button class="btn-secondary" onclick="resetGame()">
                                ${success ? '💕 Find New Love' : '💫 Choose Different Character'}
                            </button>
                        </div>
                    </div>
                    ${renderFooter()}
                `;
            }
        }

        function submitName() {
            const name = document.getElementById('nameInput').value.trim();
            if (name) {
                gameState.playerName = sanitize(name);
                gameState.screen = 'gender';
                render();
            }
        }

        function quickStart() {
            const randomNames = ['Alex', 'Sam', 'Jamie', 'Riley', 'Casey', 'Morgan', 'Taylor', 'Jordan'];
            const interestPool = ['sports', 'arts', 'books', 'music', 'nature'];
            const shuffled = [...interestPool].sort(() => Math.random() - 0.5);

            if (resultRevealTimeout) { clearTimeout(resultRevealTimeout); resultRevealTimeout = null; }
            gameState = {
                screen: 'selectChar',
                playerName: random(randomNames),
                playerGender: random(['male', 'female', 'nonbinary']),
                playerTraits: {
                    age: random(['young', 'mid', 'mature']),
                    personality: random(['outgoing', 'balanced', 'reserved']),
                    interests: shuffled.slice(0, 2),
                    style: random(['casual', 'professional', 'creative'])
                },
                targetChar: null,
                location: null,
                timeOfDay: null,
                encounterNum: 0,
                maxEncounters: 8,
                points: 0,
                requiredPoints: 100,
                actionHistory: [],
                achievements: [],
                streak: 0,
                lastAction: null,
                lastPointChange: undefined,
                customActionCount: 0,
                repeatPenaltyTaught: false,
                resultRevealed: false,
                progressSaved: false,
                sessionStart: null,
                relationshipStage: 'Stranger',
                customChar: null,
                showBio: null,
                showAbout: false,
                charMemory: { trustLevel: 0, likesHumor: false, likesDeepTalk: false, likesPhysical: false, hateBragging: false, hateRude: false, positiveTopics: [], negativeTopics: [] }
            };
            render();
        }

        function selectGender(gender) {
            gameState.playerGender = gender;
            render();
        }

        function selectTrait(category, value) {
            gameState.playerTraits[category] = value;
            render();
        }

        function toggleInterest(interest) {
            const interests = gameState.playerTraits.interests;
            if (interests.includes(interest)) {
                gameState.playerTraits.interests = interests.filter(i => i !== interest);
            } else if (interests.length < 2) {
                gameState.playerTraits.interests.push(interest);
            }
            render();
        }

        function selectChar(name) {
            gameState.targetChar = name;
            render();
        }

        let customAttracted = [];
        function toggleCustomAttr(gender) {
            const btn = document.getElementById('attr-' + gender);
            if (customAttracted.includes(gender)) {
                customAttracted = customAttracted.filter(g => g !== gender);
                btn.classList.remove('selected');
            } else {
                customAttracted.push(gender);
                btn.classList.add('selected');
            }
        }

        function createCustomChar() {
            const name = sanitize(document.getElementById('customName').value.trim());
            const emoji = sanitize(document.getElementById('customEmoji').value.trim());
            const gender = document.getElementById('customGender').value;
            const personality = sanitize(document.getElementById('customPersonality').value.trim());

            if (!name || !emoji || !gender || !personality || customAttracted.length === 0) {
                alert('Please fill all fields!');
                return;
            }

            gameState.customChar = {
                name, emoji, gender, personality,
                body: 'standing across the room, the way you remember them',
                preferences: {
                    locations: ['cafe', 'park', 'bar'],
                    times: ['afternoon', 'evening'],
                    attracted_to: customAttracted,
                    age: ['young', 'mid', 'mature']
                },
                interests: ['arts', 'music'],
                speech: {
                    great: ["That's amazing! *steps closer*", "I love that. Tell me more."],
                    good: ["Nice. *small smile*", "I like it. Mm."],
                    poor: ["Hmm, okay. *looks away*", "Not sure about that."],
                    bad: ["No thanks. *steps back*", "That's not for me."]
                },
                endings: {
                    success: `${name} steps closer and writes something on the back of a receipt. 'Find me again. Soon.'`,
                    fail: `${name} smiles the polite goodbye smile and means it the polite goodbye way.`
                }
            };

            gameState.targetChar = name;
            customAttracted = [];
            gameState.screen = 'location';
            render();
        }

        function selectTime(time) {
            gameState.timeOfDay = time;
            render();
        }

        function selectLocation(loc) {
            gameState.location = loc;
            render();
        }

        function takeAction(index, actionText) {
            try {
                if (gameState.sessionStart === null) gameState.sessionStart = Date.now();
                const action = actions[gameState.location][index];
                const repeated = gameState.lastAction === actionText;
                const result = calculatePoints(action, repeated);
                const points = result.total;
                const response = getResponse(points, gameState.targetChar);

                updateMemory(actionText, points);
                gameState.actionHistory.push({ actionText, points, response, breakdown: result.breakdown, location: gameState.location });
                gameState.points += points;
                gameState.encounterNum++;
                gameState.lastPointChange = points;

                if (points > 0) {
                    gameState.streak++;
                } else {
                    gameState.streak = 0;
                }

                gameState.lastAction = actionText;
                checkAchievements();

                if (gameState.encounterNum >= gameState.maxEncounters) {
                    gameState.screen = 'result';
                }

                render();
            } catch (error) {
                console.error('Error in takeAction:', error);
                alert('Oops! Something went wrong. Please refresh and try again.');
            }
        }

        function takeCustomAction() {
            try {
                const input = document.getElementById('customAction');
                if (!input) return;

                const text = input.value.trim();
                if (!text) {
                    alert('Please type an action first!');
                    return;
                }

                if (gameState.sessionStart === null) gameState.sessionStart = Date.now();
                const result = analyzeCustomAction(text);
                const actionText = sanitize(text);

                updateMemory(actionText, result.points);
                gameState.actionHistory.push({ actionText, points: result.points, response: result.response, breakdown: result.breakdown || [], location: gameState.location });
                gameState.points += result.points;
                gameState.encounterNum++;
                gameState.lastPointChange = result.points;
                gameState.customActionCount = (gameState.customActionCount || 0) + 1;

                if (result.points > 0) {
                    gameState.streak++;
                } else {
                    gameState.streak = 0;
                }

                checkAchievements();

                if (gameState.encounterNum >= gameState.maxEncounters) {
                    gameState.screen = 'result';
                }

                render();
            } catch (error) {
                console.error('Error in takeCustomAction:', error);
                alert('Oops! Something went wrong. Please try again.');
            }
        }

        function nextEncounter() {
            gameState.screen = 'location';
            gameState.location = null;
            gameState.timeOfDay = null;
            render();
        }

        function endGame() {
            gameState.screen = 'result';
            render();
        }

        function quickReplay() {
            if (resultRevealTimeout) { clearTimeout(resultRevealTimeout); resultRevealTimeout = null; }
            const targetChar = gameState.targetChar;
            const customChar = gameState.customChar;
            const playerName = gameState.playerName;
            const playerGender = gameState.playerGender;
            const playerTraits = {...gameState.playerTraits};

            gameState = {
                screen: 'location',
                playerName,
                playerGender,
                playerTraits,
                targetChar,
                location: null,
                timeOfDay: null,
                encounterNum: 0,
                maxEncounters: 8,
                points: 0,
                requiredPoints: 100,
                actionHistory: [],
                achievements: [],
                streak: 0,
                lastAction: null,
                lastPointChange: undefined,
                customActionCount: 0,
                repeatPenaltyTaught: false,
                resultRevealed: false,
                progressSaved: false,
                sessionStart: null,
                relationshipStage: 'Stranger',
                customChar,
                showBio: null,
                showAbout: false,
                charMemory: { trustLevel: 0, likesHumor: false, likesDeepTalk: false, likesPhysical: false, hateBragging: false, hateRude: false, positiveTopics: [], negativeTopics: [] }
            };
            render();
        }

        function resetGame() {
            if (resultRevealTimeout) { clearTimeout(resultRevealTimeout); resultRevealTimeout = null; }
            gameState = {
                screen: 'menu',
                playerName: '',
                playerGender: null,
                playerTraits: { age: null, personality: null, interests: [], style: null },
                targetChar: null,
                location: null,
                timeOfDay: null,
                encounterNum: 0,
                maxEncounters: 8,
                points: 0,
                requiredPoints: 100,
                actionHistory: [],
                achievements: [],
                streak: 0,
                lastAction: null,
                lastPointChange: undefined,
                customActionCount: 0,
                repeatPenaltyTaught: false,
                resultRevealed: false,
                progressSaved: false,
                sessionStart: null,
                relationshipStage: 'Stranger',
                customChar: null,
                showBio: null,
                showAbout: false,
                charMemory: { trustLevel: 0, likesHumor: false, likesDeepTalk: false, likesPhysical: false, hateBragging: false, hateRude: false, positiveTopics: [], negativeTopics: [] }
            };
            render();
        }

        render();
    </script>
